<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>新規タブ · START</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#12100d}
a{color:var(--accent,#d4cdb8);text-decoration:none}
a:hover{color:var(--accent2,#c1503c)}
::selection{background:#d4cdb8;color:#12100d}
::selection{background:var(--accent);color:var(--bg)}
input,select,button,textarea{font-family:'IBM Plex Mono',ui-monospace,monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

#root{
  --bg:#12100d;--panel:rgba(214,201,173,.032);--panelHi:rgba(214,201,173,.075);
  --line:rgba(190,178,152,.17);--fg:#9c9585;--dim:rgba(156,149,133,.46);
  --accent:#d4cdb8;--accent2:#c1503c;
  position:relative;min-height:100vh;background:var(--bg);color:var(--fg);
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;overflow:hidden
}

/* ---- overlays ---- */
.vig{position:fixed;inset:0;pointer-events:none;z-index:70;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,var(--vig,rgba(0,0,0,.55)) 100%)}
.grid{position:fixed;inset:0;pointer-events:none;z-index:80;opacity:1;
  background-image:
    repeating-linear-gradient(to right,var(--grid,rgba(0,0,0,.03)) 0 1px,transparent 1px var(--gridGap,4.5px)),
    repeating-linear-gradient(to bottom,var(--grid,rgba(0,0,0,.03)) 0 1px,transparent 1px var(--gridGap,4.5px))}

/* ---- quote ---- */
.quote{position:fixed;top:34px;left:40px;max-width:min(calc(50vw - 60px),760px);
  max-height:calc(50vh - var(--boxH,320px) / 2 - 58px);overflow:hidden;
  display:flex;flex-direction:column;gap:9px;cursor:pointer;z-index:20}
.quote-t{font-family:'DotGothic16',monospace;font-size:12px;line-height:1.85;color:var(--dim);text-wrap:pretty;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--quoteLines,8);overflow:hidden}
.quote-a{font-size:9px;letter-spacing:2.2px;color:var(--dim);opacity:.7}

/* ---- weather ---- */
.wx{position:fixed;bottom:34px;left:40px;display:flex;flex-direction:column;gap:8px;z-index:20}
.wx-city{font-size:9px;letter-spacing:2.6px;color:var(--dim)}
.wx-row{display:flex;align-items:baseline;gap:11px}
.wx-temp{font-family:'DotGothic16',monospace;font-size:30px;line-height:1;color:var(--accent)}
.wx-cond{font-size:10px;letter-spacing:2.4px;color:var(--fg)}
.wx-hilo{font-size:9px;letter-spacing:2.2px;color:var(--dim)}

/* ---- command line ---- */
.cmd{position:fixed;bottom:36px;left:0;right:0;display:flex;align-items:center;
  justify-content:center;gap:12px;z-index:20;padding:0 264px;box-sizing:border-box;
  pointer-events:none}
.cmd>*{pointer-events:auto}
.cmd-p{font-size:11px;color:var(--accent)}
.cmd-line{font-family:'DotGothic16',monospace;font-size:14px;line-height:20px;letter-spacing:2px;color:var(--accent);white-space:pre}
.cmd-cur{width:8px;height:14px;flex:none;margin-left:2px;background:var(--accent);display:block;animation:blink 1.06s steps(1) infinite}
.cmd-eng{width:var(--cmdEng,74px);flex:none;font-size:9px;letter-spacing:2.4px;color:var(--accent);white-space:nowrap;overflow:hidden}
.cmd-slot{width:var(--cmdSlot,326px);height:20px;flex:none;display:flex;align-items:center;overflow:hidden}
.off{display:none!important}

/* ---- rail ---- */
.rail{height:100vh;display:flex;align-items:center;gap:16px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;padding-left:max(40px,calc(50vw - 419px));padding-right:140px;box-sizing:border-box}
.rail::-webkit-scrollbar{display:none}
.box{height:var(--boxH,320px);border:1px solid var(--line);background:var(--panel);box-sizing:border-box;flex:none}
.vt{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap}

/* ---- clock ---- */
.clock{width:46px;display:flex;flex-direction:column;align-items:center;
  justify-content:var(--clockJust,space-between);gap:var(--tGap,0px);padding:15px 0}
.c-date{font-family:'DotGothic16',monospace;font-size:var(--fs-date,13px);letter-spacing:1px;color:var(--fg)}
.c-wk{font-size:var(--fs-wk,9px);letter-spacing:2px;color:var(--dim)}
.c-time{font-family:'DotGothic16',monospace;font-size:var(--fs-time,19px);letter-spacing:1px;color:var(--accent)}

/* ---- image ---- */
.imgbox{width:320px;padding:9px;position:relative}
.img-vp{position:relative;width:100%;height:100%;overflow:hidden;background:var(--imgBg,rgba(0,0,0,.22));cursor:move}
.img-el{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:none;user-select:none;pointer-events:none}
.img-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:0 18px}
.img-hint b{font-weight:400;font-size:9px;letter-spacing:2.8px;color:var(--dim)}
.img-hint i{font-style:normal;font-size:9px;letter-spacing:2.2px;color:var(--dim);opacity:.6}
.img-meta{position:absolute;left:9px;bottom:9px;padding:4px 7px;background:var(--bg);font-size:8px;letter-spacing:2.2px;color:var(--dim);pointer-events:none}
.mk{position:absolute;width:9px;height:9px}
.mk-tl{top:-1px;left:-1px;border-top:1px solid var(--accent);border-left:1px solid var(--accent)}
.mk-br{bottom:-1px;right:-1px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent)}

/* ---- greeting ---- */
.greet{width:56px;display:flex;align-items:var(--tAlign,center);justify-content:center;padding:15px 0;overflow:hidden}
.greet-t{font-family:'DotGothic16',monospace;font-size:var(--fs-greet,17px);letter-spacing:var(--ls-greet,5px);line-height:1.1;color:var(--fg)}

/* ---- category panels ---- */
.panels{display:flex;align-items:center;gap:8px;flex:none;margin-left:4px}
.cat{display:flex;align-items:stretch;flex:none}
.tab{width:46px;display:flex;align-items:var(--tAlign,center);justify-content:center;padding:15px 0;cursor:pointer;overflow:hidden}
.tab:hover{border-color:var(--accent);background:var(--panelHi)}
.tab-t{text-transform:uppercase;font-family:'DotGothic16',monospace;font-size:var(--fs-cat,14px);letter-spacing:var(--ls-cat,2px);color:var(--fg)}
.tab.on,.tab.on:hover{border-color:var(--accent);background:var(--accent)}
.tab.on .tab-t{color:var(--bg)}
.pane{width:244px;height:var(--boxH,320px);flex:none;border:1px solid var(--accent);border-left:none;background:var(--panel);
  padding:17px 18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:var(--tAlign,center);gap:var(--gap-link,12px);overflow:hidden}
.lnk{display:flex;align-items:center;gap:9px;font-family:'DotGothic16',monospace;font-size:var(--fs-link,14px);
  letter-spacing:1px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk:hover{color:var(--accent)}
.lnk img{width:15px;height:15px;flex:none;image-rendering:pixelated;filter:grayscale(1) contrast(1.3) brightness(1.2);opacity:.9}
.lnk>span{overflow:hidden;text-overflow:ellipsis}
.sl{color:var(--accent);opacity:.55}
.hk{color:var(--accent)}

/* ---- config launcher ---- */
.cfg-btn{position:fixed;bottom:28px;right:28px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  background:var(--bg);padding:10px 14px;cursor:pointer;z-index:61}
.cfg-btn:hover{border-color:var(--accent)}
.cfg-dot{width:8px;height:8px;background:var(--accent);display:block}
.cfg-lbl{font-size:9px;letter-spacing:2.6px;color:var(--fg)}

/* ---- tray ---- */
.tray{position:fixed;bottom:76px;right:28px;width:376px;max-height:calc(100vh - 130px);overflow-y:auto;
  border:1px solid var(--accent);background:var(--bg);padding:20px;box-sizing:border-box;z-index:61;
  display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec.wide{gap:12px}
.sh{display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);
  font-size:9px;letter-spacing:3px;padding:6px 9px}
.sh::before{content:'';width:7px;height:7px;background:var(--bg);flex:none}
.row{display:flex;gap:8px}
.row.mid{align-items:center}
.row.sw-row{align-items:center;gap:10px}
.lab{font-size:10px;color:var(--dim);width:62px;flex:none}
.sw{width:22px;height:22px;cursor:pointer;border:1px solid var(--line);box-sizing:border-box}
.sw:hover{border-color:var(--fg)}
.sw.on{outline:1px solid var(--fg);outline-offset:2px}
.btn{background:var(--panelHi);border:1px solid transparent;padding:9px;text-align:center;font-size:10px;letter-spacing:2px;color:var(--fg);cursor:pointer;user-select:none}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.f{flex:1;min-width:0}
.btn.warn:hover{background:var(--accent2);color:var(--bg)}
.stp{width:34px;flex:none;background:var(--panelHi);border:1px solid transparent;padding:7px;text-align:center;font-size:11px;color:var(--fg);cursor:pointer;user-select:none}
.stp:hover{background:var(--fg);color:var(--bg)}
.stp.warn:hover{background:var(--accent2);color:var(--bg)}
.val{flex:1;text-align:center;font-size:10px;letter-spacing:1px;color:var(--fg)}
.in{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:12px;padding:9px 10px;outline:none}
.in:focus{border-color:var(--accent)}
.in.tiny{font-size:11px;padding:8px}
.in.key{width:44px;flex:none;color:var(--accent);text-align:center;padding:9px}
.sel{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--fg);font-size:11px;padding:9px 8px;outline:none}
.hexrow{display:flex;align-items:center;gap:8px}
.hexrow .hash{font-size:11px;color:var(--dim);width:62px;flex:none;text-align:right;padding-right:2px}
.hex{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);
  font-size:11px;letter-spacing:2px;padding:7px 9px;outline:none;text-transform:lowercase}
.hex:focus{border-color:var(--accent)}
.hex.bad{border-color:var(--accent2)}
.prev{width:22px;height:22px;flex:none;border:1px solid var(--line);box-sizing:border-box}
.note{font-size:9px;letter-spacing:1.8px;color:var(--dim)}
.note.tall{line-height:1.9}
.hour{width:34px;flex:none;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:11px;padding:8px 2px;text-align:center;outline:none}
.band{font-size:9px;letter-spacing:1.6px;width:34px;flex:none}
.lrow{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--panel);border:1px solid transparent;cursor:grab}
.lrow:hover{background:var(--panelHi)}
.lrow .grip{font-size:10px;color:var(--dim)}
.lrow .k{font-size:11px;color:var(--accent);width:12px;text-align:center;flex:none}
.lrow .nm{font-size:11px;color:var(--fg);width:88px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .hs{font-size:10px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .rm{font-size:12px;color:var(--dim);cursor:pointer;padding:0 3px}
.lrow .rm:hover{color:var(--accent2)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.th{width:42px;height:42px;overflow:hidden;cursor:pointer;background:rgba(0,0,0,.25);outline:1px solid var(--line);outline-offset:-1px}
.th.on{outline-color:var(--accent)}
.th img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.opt{flex:1;background:var(--panelHi);border:1px solid transparent;color:var(--dim);padding:7px 0;text-align:center;font-size:9px;letter-spacing:1px;cursor:pointer;user-select:none}
.opt:hover{background:var(--fg);color:var(--bg)}
.opt.on{background:var(--fg);color:var(--bg)}
.ta{width:100%;box-sizing:border-box;height:96px;resize:vertical;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);font-size:10px;line-height:1.6;padding:9px 10px;outline:none}
.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.foot span{font-size:9px;letter-spacing:2px;color:var(--dim)}
.foot .reset{cursor:pointer}
.foot .reset:hover{color:var(--accent2)}
[role="button"]:focus-visible,.cmd-in:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

/* the bottom strip shares space with the weather block and the config button */
@media (max-width:900px){
  .cmd{left:40px;right:auto;width:auto;padding:0;bottom:118px;justify-content:flex-start}
}
</style>
</head>

function effGreeting() {

    .map(function (k) { return { k: k, start: Number(S.bands[k]) || 0 }; })
    .sort(function (a, b) { return a.start - b.start; });
  var pick = bands[bands.length - 1];
  bands.forEach(function (b) { if (hh >= b.start) pick = b; });

function computeSizing() {
  var B = { greet: 17, greetLs: 5, date: 13, wk: 9, time: 19, cat: 14, catLs: 2, link: 14 };
  var need = function (sc) {
    var texts = [S.greeting];
    ['morning', 'afternoon', 'evening', 'night'].forEach(function (k) { texts.push(S.greets[k]); });
    var gN = Math.max.apply(null, texts.map(function (t) { return (t || '').length; })) || 1;
    var g = gN * (B.greet * sc + B.greetLs * sc) + 46;
    var timeN = S.clock24 ? 5 : 8;
    var c = 30 + 10 * (B.date * sc + 1) + 3 * (B.wk * sc + 2) + timeN * (B.time * sc + 1) + 18;
    var catN = Math.max.apply(null, S.cats.map(function (x) { return (x.name || '').length; }));
    var strip = catN * (B.cat * sc + B.catLs * sc) + 30;
    var ln = Math.max.apply(null, S.cats.map(function (x) { return x.links.length; }));
    var p = 34 + ln * (B.link * sc * 1.5) + Math.max(0, ln - 1) * (12 * sc);
    return Math.max(g, c, strip, p);
  };
  /* Never let a box grow past what the window can show. 150px is reserved top
     and bottom for the quote and the weather/terminal cluster. S.boxH keeps the
     user's preference untouched; only the applied height is clamped, so a tall
     setting still applies in full on a taller display. */
  var maxH = Math.max(180, (window.innerHeight || 800) - 300);
  var sc = S.textScale, H = Math.min(Math.max(180, S.boxH), maxH);
  var capped = Math.max(180, S.boxH) > maxH;
  if (S.fitMode !== 'fit') {
    H = Math.max(H, Math.ceil(need(sc)));
    if (H > maxH) { H = maxH; capped = true; }
  }
  if (S.fitMode === 'fit' || capped) {
    for (var i = 0; i < 10 && need(sc) > H; i++) sc = Math.max(0.3, sc * (H / need(sc)) * 0.995);
    if (need(sc) > H) sc = Math.max(0.3, sc * (H / need(sc)) * 0.98);
  }
  return { sc: sc, H: Math.round(H), B: B, capped: capped };
}

function applySizing() {
  var el = D.root; if (!el) return;
  var z = computeSizing(), sc = z.sc, B = z.B;
  var Sv = function (k, v) { el.style.setProperty(k, v); };
  var px = function (v) { return (Math.round(v * 10) / 10) + 'px'; };
  Sv('--boxH', z.H + 'px');
  Sv('--fs-greet', px(B.greet * sc)); Sv('--ls-greet', px(B.greetLs * sc));
  Sv('--fs-date', px(B.date * sc));
  Sv('--fs-wk', px(Math.max(7, B.wk * sc)));
  Sv('--fs-time', px(B.time * sc));
  Sv('--fs-cat', px(B.cat * sc)); Sv('--ls-cat', px(B.catLs * sc));
  Sv('--fs-link', px(B.link * sc));
  Sv('--gap-link', px(12 * sc));
  Sv('--tAlign', S.align === 'top' ? 'flex-start' : 'center');
  Sv('--clockJust', 'center');            /* the clock always centres */
  Sv('--tGap', px(14 * sc));
  Sv('--cmdSlot', S.searchEnabled ? '326px' : '140px');
  Sv('--cmdEng', S.searchEnabled ? '74px' : '0px');
  var above = Math.floor(((window.innerHeight || 800) - z.H) / 2) - 34 - 24;
  Sv('--quoteLines', String(Math.max(2, Math.floor(above / 22.2))));
  applyImage();
}

function ingest(files) {
  var list = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type); });
  if (!list.length) return;
  var pending = list.length, added = [];
  list.forEach(function (f) {
    var r = new FileReader();
    r.onload = function () {
      added.push({
        id: 'i' + Date.now() + Math.random().toString(36).slice(2, 6),
        src: r.result, name: f.name, s: 1, x: 0, y: 0
      });
      if (--pending === 0) setImgs(S.imgs.concat(added), S.imgs.length);
    };
    r.onerror = function () {
      if (--pending === 0 && added.length) setImgs(S.imgs.concat(added), S.imgs.length);
    };
    r.readAsDataURL(f);
  });
}

function bucketOf(sched, now) {

  if (sched === 'day')  return Math.floor(now / 86400000);
  if (sched === 'week') return Math.floor(now / 604800000);
  return sched;
}

/* ------------------------------------------------------------------ *
 * quotes — PULL fetches the configured source, falls back to built-ins
 * ------------------------------------------------------------------ */
/* One quote per line, "Author, the quote text". A line with no comma is
   taken as an unattributed quote. Only the first comma splits, so commas
   inside the quote itself survive. */
function parseQuotes(raw) {
  return String(raw || '').split(/\r?\n/).map(function (l) {
    l = l.trim();
    if (!l) return null;
    var i = l.indexOf(',');
    if (i < 0) return { text: l, author: '' };
    return { author: l.slice(0, i).trim(), text: l.slice(i + 1).trim() };
  }).filter(function (q) { return q && q.text; });
}

function cachedRemoteQuotes() {
  try {
    var c = JSON.parse(localStorage.getItem(Q_KEY) || 'null');
    if (c && c.url === S.gistUrl && Array.isArray(c.list) && c.list.length) return c.list;
  } catch (e) {}
  return null;
}

function applyQuotes() {
  var list = null;
  if (S.quoteSource === 'custom') list = parseQuotes(S.quoteCustom);
  else if (S.quoteSource === 'url') list = cachedRemoteQuotes();
  QUOTES = (list && list.length) ? list : BASE_QUOTES.slice();
  if (S.quoteIdx >= QUOTES.length) S.quoteIdx = 0;
}

function gistEndpoint(url) {
  var u = String(url || '').trim();
  if (!u) return null;
  if (!/^https?:\/\//.test(u)) u = 'https://' + u;
  var m = u.match(/^https?:\/\/gist\.github\.com\/[^/]+\/([0-9a-f]{8,})/i);
  if (m) return { api: true, url: 'https://api.github.com/gists/' + m[1] };
  return { api: false, url: u };
}

function pullQuotes() {
  var ep = gistEndpoint(S.gistUrl);
  if (!ep) return;
  _pullMsg = '···'; renderTray();
  fetch(ep.url, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return ep.api ? r.json() : r.text(); })
    .then(function (body) {
      var text = '';
      if (ep.api) {
        var files = body && body.files || {};
        Object.keys(files).forEach(function (k) { text += (files[k].content || '') + '\n'; });
      } else { text = String(body); }
      var list = parseQuotes(text);
      if (!list.length) throw 0;
      try { localStorage.setItem(Q_KEY, JSON.stringify({ url: S.gistUrl, list: list })); } catch (e) {}
      QUOTES = list;
      _pullMsg = 'OK';
      set({ quoteIdx: 0 });
      setTimeout(function () { _pullMsg = 'PULL'; renderTray(); }, 1400);
    })
    .catch(function () {
      applyQuotes();
      _pullMsg = 'OFFLINE';
      render();
      setTimeout(function () { _pullMsg = 'PULL'; renderTray(); }, 1600);
    });

/* ------------------------------------------------------------------ *
 * weather — Open-Meteo, no key required; static values stand in on failure
 * ------------------------------------------------------------------ */
var _wxKey = null, WX_LABEL = '';
var GEOMODES = [
  { id: 'manual',  label: 'MANUAL'  },
  { id: 'approx',  label: 'APPROX'  },
  { id: 'precise', label: 'PRECISE' }
];

/* Open-Meteo returns an IANA zone, so the last segment gives a usable place
   name without a second round trip to a reverse geocoder. */
function tzLabel(tz) {
  var seg = String(tz || '').split('/').pop() || '';
  return seg.replace(/_/g, ' ').toUpperCase() || '';
}

function hourOf(iso) {
  var m = String(iso || '').match(/T(\d{2}):(\d{2})/);
  return m ? Number(m[1]) + Number(m[2]) / 60 : null;
}

function forecastAt(lat, lon, label, key) {
  return fetch('https://api.open-meteo.com/v1/forecast?forecast_days=1&timezone=auto' +
    '&latitude=' + lat + '&longitude=' + lon +
    '&current=temperature_2m,weather_code' +
    '&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset')
    .then(function (r) { return r.json(); })
    .then(function (f) {
      if (!f || !f.current || !f.daily) throw 0;
      var code = WMO[f.current.weather_code] || ['—', '—'];
      var wx = {
        c:  Math.round(f.current.temperature_2m),
        hi: Math.round(f.daily.temperature_2m_max[0]),
        lo: Math.round(f.daily.temperature_2m_min[0]),
        cond: code[0], kana: code[1], live: true
      };
      var rise = hourOf(f.daily.sunrise && f.daily.sunrise[0]);
      var setH = hourOf(f.daily.sunset && f.daily.sunset[0]);
      WX = wx;
      SUN = { rise: rise == null ? SUN.rise : rise, set: setH == null ? SUN.set : setH };
      WX_LABEL = label || tzLabel(f.timezone) || WX_LABEL;
      try {
        localStorage.setItem(WX_KEY, JSON.stringify({ key: key, at: Date.now(), wx: WX, sun: SUN, label: WX_LABEL }));
      } catch (e) {}
      paint();
      if (S.trayOpen) renderTray();   /* the location readout is built from WX_LABEL */
      if (S.themeMode === 'auto') applyTheme();
    });
}

function fetchWeather(force) {
  var mode = S.geoMode || 'manual';
  var city = (S.city || '').trim();
  var key = mode === 'manual' ? 'city:' + city.toUpperCase() : mode;
  if (!force && _wxKey === key) return;
  _wxKey = key;

  try {
    var c = JSON.parse(localStorage.getItem(WX_KEY) || 'null');
    if (c && c.key === key && Date.now() - c.at < 1800000) {
      WX = c.wx; SUN = c.sun; if (c.label) WX_LABEL = c.label;
      paint();
      if (S.themeMode === 'auto') applyTheme();
      return;
    }
  } catch (e) {}

  var quiet = function () { /* leave whatever is already on screen */ };

  if (mode === 'approx') {
    /* IP lookup: no permission prompt, city name comes back with the position */
    fetch('https://ipapi.co/json/')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || j.latitude == null) throw 0;
        return forecastAt(j.latitude, j.longitude, String(j.city || '').toUpperCase(), key);
      })
      .catch(quiet);
    return;
  }

  if (mode === 'precise') {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      function (pos) { forecastAt(pos.coords.latitude, pos.coords.longitude, '', key).catch(quiet); },
      quiet,
      { timeout: 10000, maximumAge: 600000 }
    );
    return;
  }

  if (!city) return;
  fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=' + encodeURIComponent(city))
    .then(function (r) { return r.json(); })
    .then(function (g) {
      var p = g && g.results && g.results[0];
      if (!p) throw 0;
      return forecastAt(p.latitude, p.longitude, city.toUpperCase(), key);
    })
    .catch(quiet);
}

/* ------------------------------------------------------------------ *
 * search
 * ------------------------------------------------------------------ */
function parseQuery(q) {
  var m = String(q || '').match(/^([a-z])(?:\s+(.*))?$/i);
  if (m) {
    var eng = engineList().filter(function (x) { return x.id === m[1].toLowerCase(); })[0];
    if (eng) return { eng: eng, term: m[2] || '' };
  }
  var all = engineList();
  var cur = all.filter(function (x) { return x.id === S.engine; })[0] || all[0];
  return { eng: cur, term: String(q || '') };
}

/* the line is the whole command buffer; a leading slash means it is a query */
function typing() { return S.line.charAt(0) === '/'; }
function queryText() { return S.line.replace(/^\//, ''); }

function submitLine() {
  var r = parseQuery(queryText());
  if (!r.term.trim()) return;
  window.open(searchUrl(r.eng, r.term.trim()), '_blank', 'noopener');
  setState({ line: '' });
}

/* ------------------------------------------------------------------ *
 * keyboard
 * ------------------------------------------------------------------ */
function handleKey(e) {
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  /* once the line holds a slash every keystroke is text, not a shortcut */
  if (typing()) {
    if (e.key === 'Escape')    { e.preventDefault(); setState({ line: '' }); return; }
    if (e.key === 'Enter')     { e.preventDefault(); submitLine(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); setState({ line: S.line.slice(0, -1) }); return; }
    if (e.key.length === 1)    { e.preventDefault(); setState({ line: S.line + e.key }); return; }
    return;
  }

  if (e.key === 'Escape') {
    if (S.trayOpen) setState({ trayOpen: false });
    else setState({ openId: null, line: '' });
    return;
  }
  if (e.key === '/' && S.searchEnabled) { e.preventDefault(); setState({ line: '/' }); return; }

  var k = (e.key || '').toLowerCase();
  if (k.length !== 1 || !/[a-z0-9]/.test(k)) return;

  var open = S.cats.filter(function (c) { return c.id === S.openId; })[0];
  if (open) {
    var link = open.links.filter(function (l) { return (l.key || '').toLowerCase() === k; })[0];
    if (link) {
      e.preventDefault();
      window.open(link.url, '_blank', 'noopener');
      setState({ openId: null, line: (open.key || '').toLowerCase() + ' ' + k + ' ▸' });
      return;
    }
  }
  var cat = S.cats.filter(function (c) { return (c.key || '').toLowerCase() === k; })[0];
  if (cat) {
    e.preventDefault();
    var same = S.openId === cat.id;
    setState({ openId: same ? null : cat.id, line: same ? '' : k });
  } else {
    setState({ line: '?' });
  }
}

function handlePaste(e) {
  if (!typing()) return;
  var cd = e.clipboardData || window.clipboardData;
  var t = cd ? (cd.getData('text') || '') : '';
  if (!t) return;
  e.preventDefault();
  setState({ line: S.line + t.replace(/[\r\n]+/g, ' ') });
}

/* ------------------------------------------------------------------ *
 * reorder + FLIP
 * ------------------------------------------------------------------ */
function reorder(list, from, to) {
  var out = list.slice();
  var it = out.splice(from, 1)[0];
  out.splice(to, 0, it);
  return out;
}

/* dragover fires continuously, even with the pointer still, and
   getBoundingClientRect() reports mid-flight positions while the FLIP
   transition runs. Both feed bad indices straight back into the reorder,

function dragTarget(container, pos, horizontal, dragNode) {
  var others = Array.prototype.slice.call(container.children).filter(function (k) { return k !== dragNode; });
  for (var i = 0; i < others.length; i++) {
    var r = others[i].getBoundingClientRect();
    var mid = horizontal ? r.left + r.width / 2 : r.top + r.height / 2;
    if (pos < mid) return i;

function snapFlip(container, attr) {

  var map = {};
  container.querySelectorAll('[' + attr + ']').forEach(function (el) {
    map[el.getAttribute(attr)] = el.getBoundingClientRect();
  });
  _flip = { container: container, attr: attr, map: map };
}
function playFlip() {
  var f = _flip;
  if (!f || !f.container || !f.container.isConnected) { _flip = null; return; }
  _flip = null;
  f.container.querySelectorAll('[' + f.attr + ']').forEach(function (el) {
    var prev = f.map[el.getAttribute(f.attr)];
    if (!prev) return;
    var now = el.getBoundingClientRect();
    var dx = prev.left - now.left, dy = prev.top - now.top;

      h('span', { c: 'lab', t: 'HEIGHT' }),
      stp('−', function () { set({ boxH: Math.max(200, S.boxH - 20) }); }, 0, 'Shorter boxes'),
      h('span', { c: 'val', t: sizing.H + 'PX' + (sizing.capped ? ' · CAPPED' : (S.fitMode === 'fit' ? '' : ' · AUTO')) }),
      stp('＋', function () { set({ boxH: Math.min(760, S.boxH + 20) }); }, 0, 'Taller boxes')
    ]),
    h('div', { c: 'row' }, [
      btn(S.linkIcons ? 'FAVICONS ON' : 'FAVICONS OFF', function () {
        set({ linkIcons: !S.linkIcons });
      }, { f: 1 })
    ])
  ]);

  /* 03 GREETING */
  var greetBody;
  if (S.greetMode === 'time') {
    var kana = { morning: '朝', afternoon: '昼', evening: '夕', night: '夜' };
    greetBody = h('div', { s: 'display:flex;flex-direction:column;gap:7px' },
      ['morning', 'afternoon', 'evening', 'night'].map(function (k) {
        var active = effGreeting() === S.greets[k];
        var col = active ? 'var(--accent)' : 'var(--dim)';
        var hourIn = h('input', {
          c: 'hour', s: 'color:' + col,
          a: { 'data-k': 'hr-' + k, maxlength: '2' },
          on: { input: function (e) {
            var v = Math.max(0, Math.min(23, parseInt(e.target.value, 10) || 0));
            set({ bands: Object.assign({}, S.bands, defineOne(k, v)) });
          } }
        });
        hourIn.value = String(S.bands[k]);
        return h('div', { s: 'display:flex;align-items:center;gap:8px' }, [
          hourIn,
          h('span', { c: 'band', s: 'color:' + col, t: kana[k] }),
          field('gr-' + k, S.greets[k], function (e) {
            set({ greets: Object.assign({}, S.greets, defineOne(k, e.target.value)) });
          })
        ]);
      })
    );
  } else {
    greetBody = field('greeting', S.greeting, function (e) { set({ greeting: e.target.value }); },
      { c: 'full', s: 'flex:none;width:100%;box-sizing:border-box' });
  }
  var s03 = sec(null, [
    head('03 GREETING · 挨拶'),
    btn(S.greetMode === 'time' ? 'BY TIME OF DAY' : 'ONE GREETING', function () {
      set({ greetMode: S.greetMode === 'time' ? 'static' : 'time' });
    }),
    greetBody,
    S.greetMode === 'time'
      ? h('div', { s: 'display:flex;gap:8px' }, [
          h('span', { c: 'note', s: 'width:76px;flex:none;letter-spacing:1px', t: 'START HOUR' }),
          h('span', { c: 'note', t: 'TEXT' })
        ])
      : note('TEXT')
  ]);

  /* 04 WEATHER */
  var unitBtn = btn('°' + S.unit, function () { set({ unit: S.unit === 'C' ? 'F' : 'C' }); },
    { s: 'width:64px;flex:none;letter-spacing:1px' });
  var geoNote = { manual: '', approx: 'POSITION FROM IP ADDRESS · NOTHING TO ALLOW',
                  precise: 'THE BROWSER WILL ASK TO SHARE YOUR LOCATION' }[S.geoMode] || '';
  var s04 = sec(null, [
    head('04 WEATHER · 天気'),
    h('div', { c: 'row' }, GEOMODES.map(function (o) {
      return h('div', { c: 'opt' + (S.geoMode === o.id ? ' on' : ''), t: o.label, btn: 1, on: { click: function () {
        set({ geoMode: o.id });
        fetchWeather(true);
      } } });
    })),
    S.geoMode === 'manual'
      ? h('div', { c: 'row' }, [
          field('city', S.city, function (e) {
            set({ city: e.target.value.toUpperCase() });
            clearTimeout(_wxDebounce);
            _wxDebounce = setTimeout(function () { fetchWeather(); }, 700);
          }),
          unitBtn
        ])
      : h('div', { c: 'row' }, [
          h('div', { c: 'in', s: 'color:var(--dim)', t: WX_LABEL || 'LOCATING…' }),
          unitBtn
        ]),
    geoNote ? note(geoNote) : null
  ]);

  /* 05 QUOTE */
  D.pull = btn(_pullMsg, pullQuotes, { s: 'width:64px;flex:none;letter-spacing:1px' });
  var qCustom = h('textarea', { c: 'ta', s: 'height:74px', a: { 'data-k': 'qcustom', spellcheck: 'false',
    placeholder: 'Author, the quote text' }, on: {
    input: function (e) { S.quoteCustom = e.target.value; applyQuotes(); paint(); persist(); }
  } });
  qCustom.value = S.quoteCustom;

  var s05 = sec(null, [
    head('05 QUOTE · 引用'),
    h('div', { c: 'row' }, QSOURCES.map(function (o) {
      return h('div', { c: 'opt' + (S.quoteSource === o.id ? ' on' : ''), t: o.label, btn: 1, on: { click: function () {
        _qBucket = undefined;
        S.quoteSource = o.id; S.quoteIdx = 0;
        applyQuotes();
        set({ quoteSource: o.id, quoteIdx: 0 });
      } } });
    })),
    S.quoteSource === 'custom' ? qCustom : null,
    S.quoteSource === 'url' ? h('div', { c: 'row' }, [
      field('gist', S.gistUrl, function (e) { set({ gistUrl: e.target.value }); },
        { c: 'tiny', ph: 'raw gist URL', s: 'font-size:11px;padding:9px 10px' }),
      D.pull
    ]) : null,
    (S.quoteSource === 'custom' || S.quoteSource === 'url')
      ? note('AUTHOR, QUOTE TEXT · ONE PER LINE') : null,
    h('div', { c: 'row mid' }, [
      h('span', { c: 'lab', t: 'ROTATE' }),
      h('div', { s: 'flex:1;display:flex;gap:5px' }, SCHED.map(function (o) {
        return h('div', { c: 'opt' + (S.quoteSched === o.id ? ' on' : ''), t: o.label, btn: 1, on: { click: function () {
          _qBucket = undefined;
          set({ quoteSched: o.id });
        } } });
      }))
    ])
  ]);

  /* 06 PANELS */
  var catSel = h('select', { c: 'sel', a: { 'data-k': 'catsel' }, on: {
    change: function (e) { setState({ editCatId: e.target.value }); }
  } }, S.cats.map(function (c) {
    return h('option', { t: c.name, a: { value: c.id } });
  }));
  catSel.value = S.editCatId;

  D.linksBox = h('div', { s: 'display:flex;flex-direction:column;gap:3px;margin-top:2px' },
    (ec.links || []).map(buildLinkRow));

  var s06 = sec(null, [
    head('06 PANELS · パネル'),
    h('div', { c: 'row' }, [
      catSel,
      btn('＋', function () {
        var id = 'cat' + Date.now();
        set({ cats: S.cats.concat([{ id: id, name: 'new panel', key: 'n', links: [] }]), editCatId: id });
      }, { al: 'Add panel', s: 'width:44px;flex:none;font-size:11px;letter-spacing:0' }),
      btn('×', function () {
        if (S.cats.length <= 1) return;
        var rest = S.cats.filter(function (c) { return c.id !== S.editCatId; });
        set({ cats: rest, editCatId: rest[0].id, openId: null });
      }, { warn: 1, al: 'Delete panel', s: 'width:44px;flex:none;font-size:11px;letter-spacing:0' })
    ]),
    h('div', { c: 'row' }, [
      field('catname', ec.name, function (e) { updateCat({ name: e.target.value }); }),
      field('catkey', ec.key, function (e) { updateCat({ key: e.target.value.slice(0, 1).toLowerCase() }); }, { c: 'key', max: '1' })
    ]),
    D.linksBox,
    h('div', { s: 'display:flex;gap:6px;margin-top:4px' }, [
      field('nl', S.nl, function (e) { setState({ nl: e.target.value }); }, { c: 'tiny', ph: 'label' }),
      field('nk', S.nk, function (e) { setState({ nk: e.target.value.slice(0, 1).toLowerCase() }); },
        { c: 'tiny', max: '1', s: 'width:34px;flex:none;color:var(--accent);text-align:center;padding:8px 4px' }),
      field('nu', S.nu, function (e) { setState({ nu: e.target.value }); }, { c: 'tiny', ph: 'url' }),
      btn('ADD', function () {
        if (!S.nl.trim()) return;
        var label = S.nl.trim();
        var key = (S.nk || label[0]).toLowerCase();
        var raw = S.nu.trim();
        var url = raw ? (/^https?:/.test(raw) ? raw : 'https://' + raw) : '#';
        S.nl = ''; S.nk = ''; S.nu = '';
        updateCat({ links: (ec.links || []).concat([{ label: label, key: key, url: url }]) });
      }, { s: 'width:44px;flex:none;padding:8px;font-size:10px;letter-spacing:0' })
    ])
  ]);

  /* 07 IMAGE */
  var im = curImg();
  var s07 = sec(null, [
    head('07 IMAGE · 画像'),
    h('div', { c: 'row' }, [
      btn('ADD IMAGE', function () { D.fileIn.click(); }, { f: 1 }),
      btn('‹', function () {
        if (!S.imgs.length) return;
        setState({ imgIdx: (S.imgIdx - 1 + S.imgs.length) % S.imgs.length }, function () { applyImage(); persist(); });
      }, { al: 'Previous image', s: 'width:38px;flex:none;font-size:11px;letter-spacing:0' }),
      btn('›', function () {
        if (!S.imgs.length) return;
        setState({ imgIdx: (S.imgIdx + 1) % S.imgs.length }, function () { applyImage(); persist(); });
      }, { al: 'Next image', s: 'width:38px;flex:none;font-size:11px;letter-spacing:0' }),
      btn('×', function () {
        if (!S.imgs.length) return;
        setImgs(S.imgs.filter(function (_, i) { return i !== S.imgIdx; }), Math.max(0, S.imgIdx - 1));
      }, { warn: 1, al: 'Delete image', s: 'width:38px;flex:none;font-size:11px;letter-spacing:0' })
    ]),
    h('div', { c: 'thumbs' }, S.imgs.map(function (t, i) {
      return h('div', { c: 'th' + (i === S.imgIdx ? ' on' : ''), btn: 1, al: 'Image ' + (i + 1), on: { click: function () {
        setState({ imgIdx: i }, function () { applyImage(); persist(); });
      } } }, t.src ? h('img', { a: { src: t.src, alt: '' } }) : null);
    })),
    h('div', { c: 'row mid' }, [
      h('span', { c: 'lab', t: 'CROP' }),
      stp('−', function () { patchImg({ s: Math.max(1, Math.round(((curImg() || {}).s || 1) * 10 - 1) / 10) }); }, 0, 'Zoom out'),
      h('span', { c: 'val', t: im ? Math.round((im.s || 1) * 100) + '%' : '—' }),
      stp('＋', function () { patchImg({ s: Math.min(4, Math.round(((curImg() || {}).s || 1) * 10 + 1) / 10) }); }, 0, 'Zoom in'),
      btn('FIT', function () { patchImg({ s: 1, x: 0, y: 0 }); },
        { s: 'width:52px;flex:none;padding:7px;font-size:9px;letter-spacing:1px' })
    ]),
    note('DRAG INSIDE THE BOX TO REPOSITION'),
    h('div', { c: 'row mid' }, [
      h('span', { c: 'lab', t: 'ROTATE' }),
      h('div', { s: 'flex:1;display:flex;gap:5px' }, SCHED.map(function (o) {
        return h('div', { c: 'opt' + (S.imgSched === o.id ? ' on' : ''), t: o.label, btn: 1, on: { click: function () {
          _bucket = undefined;
          set({ imgSched: o.id });
        } } });
      }))
    ])
  ]);

  /* 08 SEARCH */
  var engSel = h('select', { c: 'sel', a: { 'data-k': 'engsel' }, on: {
    change: function (e) { set({ engine: e.target.value }); }
  } }, engineList().map(function (e) { return h('option', { t: e.name, a: { value: e.id } }); }));
  engSel.value = S.engine;
  var s08 = sec(null, [
    head('08 SEARCH · 検索'),
    h('div', { c: 'row' }, [
      engSel,
      btn(S.searchEnabled ? 'SEARCH ON' : 'SEARCH OFF', function () { set({ searchEnabled: !S.searchEnabled }); },
        { s: 'width:96px;flex:none' })
    ]),
    field('engcustom', S.engineCustom, function (e) { set({ engineCustom: e.target.value }); },
      { c: 'tiny', ph: 'https://example.com/search?q=%s' }),
    note('CUSTOM ENGINE · %s IS THE QUERY · PREFIX c')
  ]);

  /* 09 TAB */
  var s09 = sec(null, [
    head('09 TAB · タブ'),
    h('div', { c: 'row' }, [
      field('tabtitle', S.tabTitle, function (e) { set({ tabTitle: e.target.value }, true); }),
      field('favglyph', S.favGlyph, function (e) { set({ favGlyph: e.target.value.slice(0, 2) }, true); },
        { max: '2', s: 'width:56px;flex:none;color:var(--accent);text-align:center;padding:9px 4px' })
    ]),
    note('TITLE · FAVICON GLYPH (1–2 CHARACTERS)')
  ]);

  /* 10 CONFIG */
  var ta = h('textarea', { c: 'ta', a: { 'data-k': 'cfg', spellcheck: 'false' }, on: {
    input: function (e) { S.cfgText = e.target.value; }
  } });
  ta.value = S.cfgText;
  var s10 = sec(null, [
    head('10 CONFIG · 設定'),
    ta,
    h('div', { c: 'row' }, [
      btn(S.cfgMsg === 'copied' ? 'COPIED' : 'EXPORT', function () {
        var txt = JSON.stringify(exportable(), null, 1);
        setState({ cfgText: txt, cfgMsg: 'copied' });
        try { navigator.clipboard.writeText(txt); } catch (e) {}
        setTimeout(function () { setState({ cfgMsg: '' }); }, 1400);
      }, { f: 1 }),
      btn(S.cfgMsg === 'bad' ? 'INVALID' : (S.cfgMsg === 'ok' ? 'APPLIED' : 'IMPORT'), function () {
        try {
          var o = JSON.parse(S.cfgText);
          if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('bad');
          Object.assign(S, o, { cfgMsg: 'ok' });
          render(); applyTheme(); persist();
        } catch (e) { setState({ cfgMsg: 'bad' }); }
        setTimeout(function () { setState({ cfgMsg: '' }); }, 1600);
      }, { f: 1 })
    ])
  ]);

  var foot = h('div', { c: 'foot' }, [
    h('span', { t: 'ESC TO CLOSE' }),
    h('span', { c: 'reset', t: 'RESET DEFAULTS', btn: 1, on: { click: function () {
      if (!window.confirm('Reset every panel, link and setting to defaults?')) return;
      try { localStorage.removeItem(LS_KEY); localStorage.removeItem(IMG_KEY); } catch (e) {}
      location.reload();
    } } })
  ]);

  D.tray = h('div', { c: 'tray' }, [s01, s02, s03, s04, s05, s06, s07, s08, s09, s10, foot]);
  D.trayHost.appendChild(D.tray);
  D.tray.scrollTop = scrolled;   /* a rebuild must not throw the reader back to the top */
  restoreFocus(focus);
  playFlip();
}

var _wxDebounce;
function defineOne(k, v) { var o = {}; o[k] = v; return o; }

/* ------------------------------------------------------------------ *
 * render + boot
 * ------------------------------------------------------------------ */
function render() { paint(); renderPanels(); renderTray(); }

function boot() {
  buildShell();

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (saved) {
    if (!saved.themeMode) {
      saved.themeMode = saved.autoTheme ? 'auto' : ((saved.theme && saved.theme.invert) ? 'light' : 'auto');
    }
    delete saved.autoTheme;
    if (saved.theme && saved.theme.grid === undefined) {
      saved.theme.grid = saved.theme.crt !== false;
      delete saved.theme.crt;
    }
    if (saved.theme) {
      if (saved.theme.ac === undefined && saved.theme.a > 2) saved.theme.a = 0;
      if (saved.theme.gc === undefined && saved.theme.b > 2) saved.theme.b = 0;
      if (!saved.theme.ac) saved.theme.ac = { d: '#d4cdb8', l: '#33302a' };
      if (!saved.theme.gc) saved.theme.gc = { d: '#12100d', l: '#c9c6b5' };
      delete saved.theme.invert;
    }
    Object.assign(S, saved);
  }
  applyQuotes();
  if (S.quoteSched === 'open' && QUOTES.length > 1) S.quoteIdx = (S.quoteIdx + 1) % QUOTES.length;
  _qBucket = bucketOf(S.quoteSched, Date.now());

  render();
  applyTheme();
  loadImages();
  fetchWeather();

  window.addEventListener('keydown', handleKey);
  window.addEventListener('paste', handlePaste);

  var resizeRaf = null;
  window.addEventListener('resize', function () {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(function () {
      resizeRaf = null;
      applySizing();                    /* box height is computed in JS, not CSS */
      if (S.trayOpen) renderTray();     /* so the HEIGHT readout stays honest */
    });
  });

  setInterval(function () {
    S.now = Date.now();
    paint();
    tickRotation();
    tickQuoteRotation();
    if (S.themeMode === 'auto') {
      var d = new Date();
      var hr = d.getHours() + d.getMinutes() / 60;
      var want = hr >= SUN.rise && hr < SUN.set;
      if (want !== _inv) applyTheme();
    }
  }, 1000);

  setInterval(function () { fetchWeather(true); }, 1800000);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
